# Adaptive PGD (custom loop: APGD schedule, restarts, multi-step loss).
attack:
  attack: pgd
  attack_direction: untargeted   # untargeted | targeted
  attack_norm: linf              # linf | l2
  epsilons: [8]                  # integer pixel budgets; /255 internally
  attack_nb_iter: 10
  attack_nb_restarts: 1
  multi_step_loss_weight: 0.0    # lambda for PCLD intermediate CE (0 = off)
  eot_samples: 1
  use_apgd: 0                    # 1 = APGD adaptive step schedule
  targeted_jumps_allowed: 6      # 6 for ImageNet, 1 for CIFAR-10
  run_naive_attack: 0
  save_parquet: 1