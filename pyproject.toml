[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcld"
version = "0.1.0"
description = "PCLD: Painter-Classifier-Decisioner adversarial robustness framework"
requires-python = ">=3.10"
dependencies = [
    # core numerics (kept at the versions the original results were produced with)
    "numpy==1.26.4",
    "pandas==1.5.3",
    "pyarrow==15.0.2",
    "scipy==1.13.1",
    # torch stack
    "torch==2.5.1",
    "torchvision==0.20.1",
    "timm==1.0.11",
    # attacks / robustness
    "cleverhans==4.0.0",
    "robustbench==1.1.1",
    "autoattack @ git+https://github.com/fra31/auto-attack",
    # config system
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    # data / labels
    "imagenet_stubs @ git+https://github.com/nottombrown/imagenet_stubs",
    "datasets==2.21.0",
    "huggingface_hub>=0.24",
    # images
    "opencv-python==4.10.0.84",
    "scikit-image==0.24.0",
    "Pillow>=10.0",
    "matplotlib==3.9.2",
    # misc
    "tqdm>=4.66",
    "python-dotenv==1.0.1",
    "gdown==5.2.0",
]

[project.optional-dependencies]
notebook = ["notebook", "ipython"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pcld*"]
